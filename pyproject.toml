[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wariocr"
dynamic = ["version"]
description = "Phone photos of documents to true-scale, typographic-quality PDFs with OCR"
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Emanuele Lovato (BiNeurale)", email = "bineurale@gmail.com" }]
requires-python = ">=3.10"
keywords = ["document-scanner", "ocr", "pdf", "perspective-correction", "opencv"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Graphics :: Capture :: Scanners",
    "Topic :: Text Processing",
]
dependencies = [
    "opencv-python-headless",
    "numpy",
    "Pillow",
    "img2pdf",
]

[project.optional-dependencies]
ocr = ["ocrmypdf"]
heif = ["pillow-heif"]
dev = ["pytest", "ruff"]

[project.urls]
Homepage = "https://github.com/BiNeurale/wariOCR"
Source = "https://github.com/BiNeurale/wariOCR"
Issues = "https://github.com/BiNeurale/wariOCR/issues"

[project.scripts]
wariocr = "wariocr.cli:main"

[tool.hatch.version]
path = "wariocr/__init__.py"

[tool.hatch.build.targets.sdist]
include = ["wariocr", "tests", "tools", "pyproject.toml", "README.md", "LICENSE", "CONTRIBUTING.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "NPY", "RUF"]
ignore = [
    "E741",   # short math names (l, I) mirror the formulas
    "N802", "N803", "N806",  # uppercase matrix names (H, K, M) are conventional
    "RUF001", "RUF003",  # degree sign and similar in messages/comments
    "RUF005",  # list + numpy array is a vector sum here, not concatenation
    "RUF046",  # int(round(numpy scalar)) is intentional: numpy round may keep the float type
]
